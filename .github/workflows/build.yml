name: Build HAITIKET
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "supabase/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        run: |
          P=$(find . -name pubspec.yaml -not -path "./.git/*" | head -1)
          echo "Projet trouvé : $P"
          cd "$(dirname "$P")"
          if [ -d lib/assets ] && [ ! -d assets ]; then cp -r lib/assets assets; fi
          cp -r lib /tmp/lib_bk && cp pubspec.yaml /tmp/pubspec_bk.yaml
          [ -d assets ] && cp -r assets /tmp/assets_bk || true
          flutter create . --platforms=web --project-name haitiket --org com.haitiket
          rm -rf lib test && cp -r /tmp/lib_bk lib && cp /tmp/pubspec_bk.yaml pubspec.yaml
          mkdir -p assets && [ -d /tmp/assets_bk ] && cp -r /tmp/assets_bk/. assets/ || true
          for f in logo.png logo_t.png; do
            if [ ! -f "assets/$f" ]; then
              echo "ATTENTION : assets/$f absent du dépôt, logo provisoire utilisé"
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "assets/$f"
            fi
          done
          echo "APP=$(pwd)" >> "$GITHUB_ENV"
      - name: Dépendances
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons || echo "Icônes ignorées"
      - name: Analyse du code (seules les erreurs bloquent)
        working-directory: ${{ env.APP }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error •|issues found|No issues" ; exit ${PIPESTATUS[0]}
      - name: Build Web
        working-directory: ${{ env.APP }}
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          # Retour de paiement Plop Plop (…/payment/plopplop/success) : GitHub Pages renvoie 404.html pour une adresse inconnue.
          # En y copiant l'application, la page de retour ouvre l'application au lieu d'une erreur 404.
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: "${{ env.APP }}/build/web" }
  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        run: |
          P=$(find . -name pubspec.yaml -not -path "./.git/*" | head -1)
          cd "$(dirname "$P")"
          if [ -d lib/assets ] && [ ! -d assets ]; then cp -r lib/assets assets; fi
          cp -r lib /tmp/lib_bk && cp pubspec.yaml /tmp/pubspec_bk.yaml
          [ -d assets ] && cp -r assets /tmp/assets_bk || true
          flutter create . --platforms=android --project-name haitiket --org com.haitiket
          rm -rf lib test && cp -r /tmp/lib_bk lib && cp /tmp/pubspec_bk.yaml pubspec.yaml
          mkdir -p assets && [ -d /tmp/assets_bk ] && cp -r /tmp/assets_bk/. assets/ || true
          for f in logo.png logo_t.png; do
            if [ ! -f "assets/$f" ]; then
              echo "ATTENTION : assets/$f absent du dépôt, logo provisoire utilisé"
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "assets/$f"
            fi
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="HAITIKET"|' $M
          echo "APP=$(pwd)" >> "$GITHUB_ENV"
      - name: Dépendances
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons || echo "Icônes ignorées"
      - name: Analyse du code (seules les erreurs bloquent)
        working-directory: ${{ env.APP }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error •|issues found|No issues" ; exit ${PIPESTATUS[0]}
      - name: Build APK
        working-directory: ${{ env.APP }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk-latest "${{ env.APP }}/build/app/outputs/flutter-apk/app-release.apk" \
            --repo "${{ github.repository }}" --title "HAITIKET Android (dernier build)" --notes "APK de test, installable sur Android."
